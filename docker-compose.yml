services:
  bot:
    # Build the image from the local Dockerfile
    build: .

    # Always restart if the bot crashes or the VPS reboots
    restart: always

    # Load environment variables from the .env file
    env_file:
      - .env

    # Persist the schedule state file between container restarts.
    # IMPORTANT: Run `./start.sh` instead of `docker-compose up` directly;
    # it ensures schedule_state.json exists as a file (not a directory) before
    # Docker mounts it.  If Docker mounts a directory here, the bot will crash.
    volumes:
      - ./schedule_state.json:/app/schedule_state.json
